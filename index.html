<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Screen</title>
    <style>
        :root {
            --bg-color: #030712;
            --accent-green: #10B981;
            --accent-blue: #3B82F6;
            --text-main: #F9FAFB;
            --text-muted: #9CA3AF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .loader-container {
            text-align: center;
            width: 100%;
            max-width: 500px;
            padding: 2rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(to right, var(--accent-green), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.05em;
        }

        .welcome-text {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .sub-text {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 3rem;
            line-height: 1.6;
            font-weight: 400;
        }

        .progress-wrapper {
            position: relative;
            width: 100%;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
            overflow: hidden;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-green), var(--accent-blue));
            border-radius: 9999px;
            animation: load 4s cubic-bezier(0.65, 0, 0.35, 1) forwards;
    box-shadow: 0 0 15px var(--accent-green), 0 0 30px var(--accent-blue);

        }

        .progress-percentage {
            margin-top: 1rem;
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        @keyframes load {
            0% {
                width: 0%;
            }
            10% {
                width: 5%;
            }
            30% {
                width: 25%;
            }
            60% {
                width: 70%;
            }
            90% {
                width: 95%;
            }
            100% {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="loader-container">
        <div class="logo">SMARTTRADE.COM</div>
        <div class="welcome-text">Welcome to SmartTraders.com</div>
        <div class="sub-text">Empowering your financial journey.</div>
        
        <div class="progress-wrapper">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="progress-percentage" id="progressText">0%</div>
    </div>

    <script>
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        
        let width = 0;
        const interval = setInterval(() => {
            if (width >= 100) {
                clearInterval(interval);
                window.location.href = 'https://sheriffmwaniki99-rgb.github.io/Smart-trader';
            } else {
                width++;
                progressText.innerText = width + "%";
            }
        }, 40); // 40ms * 100 = 4000ms = 4 seconds
    </script>
</body>
</html>
