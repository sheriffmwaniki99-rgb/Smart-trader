<!DOCTYPE html>


<html lang="en">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Quick Actions Grid</title>


<style>


* {


box-sizing: border-box;


margin: 0;


padding: 0;


font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;


}


​body {


background-color: #050b14;


color: #ffffff;


display: flex;


justify-content: center;


align-items: center;


min-height: 100vh;


padding: 20px;


}


​.quick-actions-container {


display: grid;


grid-template-columns: repeat(2, 1fr);


gap: 20px;


max-width: 800px;


width: 100%;


}


​.card {


background-color: #0a1118;


border-radius: 16px;


padding: 24px;


display: flex;


flex-direction: column;


justify-content: space-between;


border-left: 4px solid transparent;


transition: transform 0.2s ease, border-color 0.2s ease;


position: relative;


overflow: hidden;


}


​.card:hover {


transform: translateY(-5px);


}


​/* Border colors for each card */


.card-upload { border-color: #ffbc0a; }


.card-free { border-color: #00e5ff; }


.card-editor { border-color: #76ff03; }


.card-strategy { border-color: #ff3d00; }


​.card-header {


display: flex;


justify-content: space-between;


align-items: flex-start;


margin-bottom: 20px;


}


​.icon {


width: 48px;


height: 48px;


display: flex;


justify-content: center;


align-items: center;


border-radius: 12px;


}


​/* Icon background colors */


.card-upload .icon { background-color: rgba(255, 188, 10, 0.1); }


.card-free .icon { background-color: rgba(0, 229, 255, 0.1); }


.card-editor .icon { background-color: rgba(118, 255, 3, 0.1); }


.card-strategy .icon { background-color: rgba(255, 61, 0, 0.1); }


​.arrow {


color: #8c9bae;


font-size: 20px;


}


​.card-content h3 {


font-size: 18px;


margin-bottom: 8px;


color: #ffffff;


}


​.card-content p {


font-size: 13px;


color: #8c9bae;


line-height: 1.4;


margin-bottom: 16px;


}


​.open-link {


font-size: 14px;


font-weight: 600;


display: flex;


align-items: center;


gap: 8px;


text-decoration: none;


cursor: pointer;


}


​/* Text colors for links */


.card-upload .open-link { color: #ffbc0a; }


.card-free .open-link { color: #00e5ff; }


.card-editor .open-link { color: #76ff03; }


.card-strategy .open-link { color: #ff3d00; }


​@media (max-width: 600px) {


.quick-actions-container {


grid-template-columns: 1fr;


}


}


</style>


</head>


<body>


​<div class="quick-actions-container">


<!-- Upload Bot -->


<div class="card card-upload">


<div class="card-header">


<div class="icon">📁</div>


<div class="arrow">➔</div>


</div>


<div class="card-content">


<h3>Upload Bot</h3>


<p>Import an XML bot from your computer.</p>


<a class="open-link">Open ➔</a>


</div>


</div>


​<!-- Free Bots -->


<div class="card card-free">


<div class="card-header">


<div class="icon">🤖</div>


<div class="arrow">➔</div>


</div>


<div class="card-content">


<h3>Free Bots</h3>


<p>Browse ready-made trading strategies.</p>


<a class="open-link">Open ➔</a>


</div>


</div>


​<!-- Bot Editor -->


<div class="card card-editor">


<div class="card-header">


<div class="icon">✂️</div>


<div class="arrow">➔</div>


</div>


<div class="card-content">


<h3>Bot Editor</h3>


<p>Build a custom bot with the visual editor.</p>


<a class="open-link">Open ➔</a>


</div>


</div>


​<!-- Quick Strategy -->


<div class="card card-strategy">


<div class="card-header">


<div class="icon">⚡</div>


<div class="arrow">➔</div>


</div>


<div class="card-content">


<h3>Quick Strategy</h3>


<p>Start fast with a pre-built strategy template.</p>


<a class="open-link">Open ➔</a>


</div>


</div>


</div>


​</body>


</html>
