<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Dashboard</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body { background-color: #0d1117; color: #c9d1d9; display: flex; height: 100vh; overflow: hidden; }
.sidebar { width: 60px; background-color: #161b22; display: flex; flex-direction: column; align-items: center; padding: 20px 0; border-right: 1px border-right: 1px solid #30363d; }
.sidebar-icon { width: 30px; height: 30px; background-color: #21262d; border-radius: 5px; margin-bottom: 20px; }
.main-content { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
.header { height: 60px; background-color: #161b22; border-bottom: 1px solid #30363d; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
.user-info { display: flex; align-items: center; }
.avatar { width: 35px; height: 35px; border-radius: 50%; background-color: #58a6ff; margin-right: 10px; }
.balance { font-weight: bold; color: #3fb595; }
.dashboard-body { flex: 1; display: flex; padding: 20px; gap: 20px; overflow: hidden; }
.chart-section { flex: 2; background-color: #161b22; border-radius: 10px; border: 1px solid #30363d; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: #8b949e; }
.trading-panel { width: 300px; background-color: #161b22; border-radius: 10px; border: 1px solid #30363d; display: flex; flex-direction: column; padding: 20px; gap: 15px; }
.trade-btn { width: 100%; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: #ffffff; }
.buy-btn { background-color: #238636; }
.buy-btn:hover { background-color: #2ea043; }
.sell-btn { background-color: #da3633; }
.sell-btn:hover { background-color: #b31d28; }
.input-group { display: flex; flex-direction: column; gap: 5px; }
input { padding: 10px; background-color: #0d1117; border: 1px solid #30363d; border-radius: 5px; color: #c9d1d9; }
</style>
</head>
<body>
<div class="sidebar">
<div class="sidebar-icon"></div>
<div class="sidebar-icon"></div>
<div class="sidebar-icon"></div>
</div>
<div class="main-content">
<div class="header">
<div class="user-info">
<div class="avatar"></div>
<span>Welcome back, Trader</span>
</div>
<div class="balance">Balance: $10,000.00</div>
</div>
<div class="dashboard-body">
<div class="chart-section">
Live Chart Integration Placeholder
</div>
<div class="trading-panel">
<div class="input-group">
<label>Amount (USD)</label>
<input type="number" placeholder="100.00">
</div>
<div class="input-group">
<label>Take Profit</label>
<input type="number" placeholder="0.00">
</div>
<div class="input-group">
<label>Stop Loss</label>
<input type="number" placeholder="0.00">
</div>
<button class="trade-btn buy-btn">Buy</button>
<button class="trade-btn sell-btn">Sell</button>
</div>
</div>
</div>
</body>
</html>
